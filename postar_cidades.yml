name: Postar Cidades

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests groq google-api-python-client google-auth-oauthlib google-auth

      - name: Executar script de cidades
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_ID: ${{ secrets.BLOGGER_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: python cidades_curiosidades.py

      - name: Salvar historico de cidades
        run: |
          git config user.name "Robo de Cidades"
          git config user.email "robo@exemplo.com"
          git add historico_cidades.txt || true
          git commit -m "Atualiza historico" || true
          git push || true
