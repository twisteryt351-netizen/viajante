name: Robo de Curiosidades de Cidades

on:
  schedule:
    - cron: '0 13 * * *'   # 13:00 UTC = 10:00 em Brasilia
  workflow_dispatch:

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests groq google-api-python-client google-auth-oauthlib google-auth
      - run: python cidades_curiosidades.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BLOGGER_ID_CIDADES: ${{ secrets.BLOGGER_ID_CIDADES }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Salvar historico de cidades
        run: |
          git config user.name "Robo de Cidades"
          git config user.email "robo@exemplo.com"
          git add historico_cidades.txt || true
          git commit -m "Atualiza historico" || true
          git push || true
